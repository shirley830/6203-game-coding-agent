name: Member 6 Delivery Validation

on:
  push:
    branches:
      - member6-Li-Jiakun-delivery-audit
  pull_request:
    paths:
      - agent/delivery.py
      - tests/test_tracing.py
      - .github/workflows/member6-delivery-validation.yml

jobs:
  trace-delivery-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install project dependencies
        run: python -m pip install -e .
      - name: Member 6 unit regression tests
        run: python -m unittest tests.test_tracing -v
      - name: Member 6 model usage and report tests
        run: python -m unittest tests.test_trace_usage -v
