name: Update final report PDF once
on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/finalize-report-pdf.yml
permissions:
  contents: write
jobs:
  patch-report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install local PDF patch dependencies
        run: python -m pip install 'pymupdf>=1.25,<1.27' fonttools
      - name: Patch original PDF and verify 18-page layout
        run: python docs/report/patch_report_pdf.py
      - name: Commit only the corrected PDF
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add report.pdf
          git diff --cached --quiet || git commit -m "Update group report PDF: retest label and Treasure Grid implementation"
          git push
