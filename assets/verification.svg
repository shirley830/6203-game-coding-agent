<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="392" viewBox="0 0 1280 392" role="img" aria-labelledby="t d">
<title id="t">How a game is verified</title>
<desc id="d">The specification becomes frozen executable scenarios before any code exists; the harness plays the game in headless Chromium with real keys and clicks; failures go back to the planner, and success needs every mandatory criterion to pass with evidence.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0f2a33"/><stop offset="0.55" stop-color="#0a1d24"/><stop offset="1" stop-color="#06141a"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.15" cy="0.2" r="0.7">
    <stop offset="0" stop-color="#2ad1a8" stop-opacity="0.17"/><stop offset="1" stop-color="#2ad1a8" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#6ff0cf"/><stop offset="1" stop-color="#38b6e8"/>
  </linearGradient>
  <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#6ff0cf" stop-opacity="0"/><stop offset="0.5" stop-color="#6ff0cf" stop-opacity="0.9"/><stop offset="1" stop-color="#38b6e8" stop-opacity="0"/>
  </linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity="0.035"/></pattern>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/></filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  <clipPath id="frame"><rect width="1280" height="392" rx="20"/></clipPath>
</defs>
<style>
  text { font-family: Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica Neue, Helvetica, Arial, sans-serif; }
  .mono { font-family: SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace; }
  .flow { stroke-dasharray: 6 10; animation: dash 1.1s linear infinite; }
  @keyframes dash { to { stroke-dashoffset: -32; } }
  .blink { animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: .25; transform: scale(1); } 50% { opacity: .9; transform: scale(1.05); } }
  .sweep { animation: sweep 5s ease-in-out infinite; }
  @keyframes sweep { 0% { transform: translateX(-420px); } 100% { transform: translateX(1320px); } }
  .v{animation-duration:12s;animation-iteration-count:infinite;}
.player{animation:move 12s ease-in-out infinite;} @keyframes move{0%,22%{transform:translateX(0)}32%,100%{transform:translateX(64px)}}
.cursor{animation:cur 12s ease-in-out infinite;} @keyframes cur{0%,34%{transform:translate(0,0)}44%,100%{transform:translate(-118px,-118px)}}
@keyframes key{0%{opacity:0}22.00%{opacity:0}22.80%{opacity:1}32.00%{opacity:1}32.80%{opacity:0}100%{opacity:0}}
@keyframes click{0%{opacity:0}44.00%{opacity:0}44.80%{opacity:1}48.00%{opacity:1}48.80%{opacity:0}100%{opacity:0}}
@keyframes tick0{0%{opacity:0}60.00%{opacity:0}60.80%{opacity:1}95.00%{opacity:1}95.80%{opacity:0}100%{opacity:0}}
@keyframes tick1{0%{opacity:0}63.00%{opacity:0}63.80%{opacity:1}95.00%{opacity:1}95.80%{opacity:0}100%{opacity:0}}
@keyframes tick2{0%{opacity:0}66.00%{opacity:0}66.80%{opacity:1}95.00%{opacity:1}95.80%{opacity:0}100%{opacity:0}}
@keyframes tick3{0%{opacity:0}69.00%{opacity:0}69.80%{opacity:1}95.00%{opacity:1}95.80%{opacity:0}100%{opacity:0}}
@keyframes tick4{0%{opacity:0}72.00%{opacity:0}72.80%{opacity:1}95.00%{opacity:1}95.80%{opacity:0}100%{opacity:0}}
@keyframes fail{0%{opacity:0}48.00%{opacity:0}48.80%{opacity:1}62.00%{opacity:1}62.80%{opacity:0}100%{opacity:0}}
@keyframes fix{0%{opacity:0}62.00%{opacity:0}62.80%{opacity:1}74.00%{opacity:1}74.80%{opacity:0}100%{opacity:0}}
@keyframes pass{0%{opacity:0}74.00%{opacity:0}74.80%{opacity:1}96.00%{opacity:1}96.80%{opacity:0}100%{opacity:0}}
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<g clip-path="url(#frame)">
  <rect width="1280" height="392" fill="url(#bg)"/>
  <rect width="1280" height="392" fill="url(#grid)"/>
  <rect width="1280" height="392" fill="url(#glow)"/>

  <!-- step labels -->
  <text x="60" y="52" font-size="12" fill="#38b6e8" font-weight="700" text-anchor="start" letter-spacing="1.6">① SPEC</text>
  <text x="330" y="52" font-size="12" fill="#6ff0cf" font-weight="700" text-anchor="start" letter-spacing="1.6">② FROZEN ACCEPTANCE</text>
  <text x="660" y="52" font-size="12" fill="#6ff0cf" font-weight="700" text-anchor="start" letter-spacing="1.6">③ PLAYED IN CHROMIUM</text>
  <text x="1010" y="52" font-size="12" fill="#4fd18b" font-weight="700" text-anchor="start" letter-spacing="1.6">④ GATE</text>

  <!-- spec document -->
  <rect x="60" y="72" width="220" height="250" rx="12" fill="#10262e" stroke="#33545e" />
  <text x="80" y="102" font-size="13" fill="#f2f8f9" font-weight="600" text-anchor="start" class="mono" >game_design_prompt.md</text>
  <g fill="#5f7f88"><rect x="80" y="122" width="170" height="8" rx="4"/><rect x="80" y="142" width="140" height="8" rx="4"/><rect x="80" y="162" width="160" height="8" rx="4"/>
  <rect x="80" y="196" width="150" height="8" rx="4" fill="#38b6e8" opacity=".7"/><rect x="80" y="216" width="120" height="8" rx="4"/><rect x="80" y="236" width="165" height="8" rx="4" fill="#38b6e8" opacity=".7"/><rect x="80" y="256" width="100" height="8" rx="4"/></g>
  <text x="80" y="300" font-size="12.5" fill="#7fa3ad" font-weight="400" text-anchor="start" >written before any code exists</text>
  <path d="M286 196 H322" stroke="#6ff0cf" stroke-width="2.5" class="flow"/>

  <!-- checklist -->
  <rect x="330" y="72" width="300" height="250" rx="12" fill="#10262e" stroke="#33545e" />
  <rect x="352" y="117" width="20" height="20" rx="5" fill="none" stroke="#33545e"/><g class="v" style="animation-name:tick0"><rect x="352" y="117" width="20" height="20" rx="5" fill="#123229" stroke="#4fd18b"/><path d="M357 127 l4 4 8 -9" fill="none" stroke="#4fd18b" stroke-width="2.4"/></g><text x="384" y="132" font-size="14" fill="#a9c2c9" font-weight="400" text-anchor="start" >R1 arrow keys move the player</text><rect x="352" y="151" width="20" height="20" rx="5" fill="none" stroke="#33545e"/><g class="v" style="animation-name:tick1"><rect x="352" y="151" width="20" height="20" rx="5" fill="#123229" stroke="#4fd18b"/><path d="M357 161 l4 4 8 -9" fill="none" stroke="#4fd18b" stroke-width="2.4"/></g><text x="384" y="166" font-size="14" fill="#a9c2c9" font-weight="400" text-anchor="start" >R2 a pickup adds one point</text><rect x="352" y="185" width="20" height="20" rx="5" fill="none" stroke="#33545e"/><g class="v" style="animation-name:tick2"><rect x="352" y="185" width="20" height="20" rx="5" fill="#123229" stroke="#4fd18b"/><path d="M357 195 l4 4 8 -9" fill="none" stroke="#4fd18b" stroke-width="2.4"/></g><text x="384" y="200" font-size="14" fill="#a9c2c9" font-weight="400" text-anchor="start" >R3 win at 10 freezes input</text><rect x="352" y="219" width="20" height="20" rx="5" fill="none" stroke="#33545e"/><g class="v" style="animation-name:tick3"><rect x="352" y="219" width="20" height="20" rx="5" fill="#123229" stroke="#4fd18b"/><path d="M357 229 l4 4 8 -9" fill="none" stroke="#4fd18b" stroke-width="2.4"/></g><text x="384" y="234" font-size="14" fill="#a9c2c9" font-weight="400" text-anchor="start" >R4 restart resets score</text><rect x="352" y="253" width="20" height="20" rx="5" fill="none" stroke="#33545e"/><g class="v" style="animation-name:tick4"><rect x="352" y="253" width="20" height="20" rx="5" fill="#123229" stroke="#4fd18b"/><path d="M357 263 l4 4 8 -9" fill="none" stroke="#4fd18b" stroke-width="2.4"/></g><text x="384" y="268" font-size="14" fill="#a9c2c9" font-weight="400" text-anchor="start" >C-CONTRACT live game state</text>
  <text x="352" y="306" font-size="12.5" fill="#7fa3ad" font-weight="400" text-anchor="start" >3-10 scenarios · real input + asserts</text>
  <path d="M636 196 H652" stroke="#6ff0cf" stroke-width="2.5" class="flow"/>

  <!-- browser -->
  <g filter="url(#shadow)"><rect x="660" y="72" width="320" height="250" rx="12" fill="#0b1b22" stroke="#2f505a" /></g>
  <path d="M660 84a12 12 0 0 1 12-12h296a12 12 0 0 1 12 12v18H660z" fill="#10242c"/>
  <circle cx="676" cy="87" r="4" fill="#ff6b6b" fill-opacity=".8"/><circle cx="690" cy="87" r="4" fill="#f5c451" fill-opacity=".8"/><circle cx="704" cy="87" r="4" fill="#4fd18b" fill-opacity=".8"/>
  <text x="830" y="91" font-size="11" fill="#7fa3ad" font-weight="400" text-anchor="middle" class="mono" >127.0.0.1:8000</text>
  <rect x="676" y="116" width="288" height="152" rx="6" fill="#111a2e" stroke="#2a3b5a"/>
  <circle cx="792" cy="160" r="6" fill="#ffd400"/><circle cx="870" cy="214" r="6" fill="#ffd400"/><circle cx="930" cy="140" r="6" fill="#ffd400"/>
  <g class="player"><circle cx="736" cy="214" r="9" fill="#3ec58f"/></g>
  <text x="690" y="136" font-size="11" fill="#cfe3ff" font-weight="400" text-anchor="start" >Score: 0 / 10</text>
  <rect x="884" y="276" width="80" height="28" rx="6" fill="#2b7bb9"/><text x="924" y="295" font-size="13" fill="#fff" font-weight="600" text-anchor="middle" >Restart</text>
  <g class="v" style="animation-name:key;opacity:0"><rect x="676" y="276" width="70" height="28" rx="6" fill="#123229" stroke="#6ff0cf"/><text x="711" y="295" font-size="13" fill="#6ff0cf" font-weight="700" text-anchor="middle" class="mono" >→ key</text></g>
  <g class="v" style="animation-name:click;opacity:0"><circle cx="924" cy="290" r="18" fill="none" stroke="#6ff0cf" stroke-width="2"/></g>
  <g class="cursor"><path d="M1042 408 l0 22 6 -6 5 11 4 -2 -5 -11 9 0 z" fill="#fff" stroke="#000" stroke-width="1"/></g>
  <path d="M986 196 H1002" stroke="#6ff0cf" stroke-width="2.5" class="flow"/>

  <!-- gate -->
  <rect x="1010" y="72" width="214" height="250" rx="12" fill="#10262e" stroke="#33545e" />
  <g class="v" style="animation-name:fail;opacity:0">
    <circle cx="1117" cy="160" r="40" fill="#3a1d1d" stroke="#ff8a7a" stroke-width="2"/>
    <path d="M1103 146 l28 28 M1131 146 l-28 28" stroke="#ff8a7a" stroke-width="4" stroke-linecap="round"/>
    <text x="1117" y="238" font-size="26" fill="#ff8a7a" font-weight="800" text-anchor="middle" >13 / 14</text><text x="1117" y="266" font-size="12.5" fill="#a9c2c9" font-weight="400" text-anchor="middle" >failing step + state</text><text x="1117" y="284" font-size="12.5" fill="#a9c2c9" font-weight="400" text-anchor="middle" >sent back to the planner</text>
  </g>
  <g class="v" style="animation-name:fix;opacity:0">
    <circle cx="1117" cy="160" r="40" fill="#33290f" stroke="#f5c451" stroke-width="2"/>
    <text x="1117" y="174" font-size="40" fill="#f5c451" font-weight="700" text-anchor="middle" >↻</text>
    <text x="1117" y="238" font-size="26" fill="#f5c451" font-weight="800" text-anchor="middle" >repair</text><text x="1117" y="266" font-size="12.5" fill="#a9c2c9" font-weight="400" text-anchor="middle" >fix the real defect,</text><text x="1117" y="284" font-size="12.5" fill="#a9c2c9" font-weight="400" text-anchor="middle" >never bend the game</text>
  </g>
  <g class="v" style="animation-name:pass">
    <circle cx="1117" cy="160" r="40" fill="#123229" stroke="#4fd18b" stroke-width="2"/>
    <path d="M1099 160 l12 12 24 -26" fill="none" stroke="#4fd18b" stroke-width="5" stroke-linecap="round"/>
    <text x="1117" y="238" font-size="26" fill="#4fd18b" font-weight="800" text-anchor="middle" >14 / 14</text><text x="1117" y="266" font-size="12.5" fill="#a9c2c9" font-weight="400" text-anchor="middle" >every mandatory criterion</text><text x="1117" y="284" font-size="12.5" fill="#a9c2c9" font-weight="400" text-anchor="middle" >passes with evidence</text>
  </g>
  <text x="640" y="362" font-size="13.5" fill="#7fa3ad" font-weight="400" text-anchor="middle" >Unpassable tests are filtered · mouse games are clicked, keyboard games are keyed · a screenshot for every scenario</text>

</g>
<rect x="0.5" y="0.5" width="1279" height="391" rx="19.5" fill="none" stroke="#2b4a54"/>
</svg>
