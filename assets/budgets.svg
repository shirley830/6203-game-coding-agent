<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-labelledby="t d">
<title id="t">Budgets and outcomes</title>
<desc id="d">Defaults: 420 s runtime, 200 steps, 80 commands, 20 recoveries, 5 retries with 5, 15, 45 and 60 second backoff. Outcomes: succeeded 0, failed 1, startup error 2, exhausted 3, cancelled 130.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0f2a33"/><stop offset="0.55" stop-color="#0a1d24"/><stop offset="1" stop-color="#06141a"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.15" cy="0.2" r="0.7">
    <stop offset="0" stop-color="#2ad1a8" stop-opacity="0.17"/><stop offset="1" stop-color="#2ad1a8" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#6ff0cf"/><stop offset="1" stop-color="#38b6e8"/>
  </linearGradient>
  <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#6ff0cf" stop-opacity="0"/><stop offset="0.5" stop-color="#6ff0cf" stop-opacity="0.9"/><stop offset="1" stop-color="#38b6e8" stop-opacity="0"/>
  </linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity="0.035"/></pattern>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/></filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  <clipPath id="frame"><rect width="1280" height="340" rx="18"/></clipPath>
</defs>
<style>
  text { font-family: Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica Neue, Helvetica, Arial, sans-serif; }
  .mono { font-family: SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace; }
  .flow { stroke-dasharray: 6 10; animation: dash 1.1s linear infinite; }
  @keyframes dash { to { stroke-dashoffset: -32; } }
  .blink { animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: .25; transform: scale(1); } 50% { opacity: .9; transform: scale(1.05); } }
  .sweep { animation: sweep 5s ease-in-out infinite; }
  @keyframes sweep { 0% { transform: translateX(-420px); } 100% { transform: translateX(1320px); } }
  
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<g clip-path="url(#frame)">
  <rect width="1280" height="340" fill="url(#bg)"/>
  <rect width="1280" height="340" fill="url(#grid)"/>
  <rect width="1280" height="340" fill="url(#glow)"/>
<rect x="40" y="30" width="224" height="120" rx="14" fill="#10262e" stroke="#33545e" />
<text x="62" y="82" font-size="36" fill="#6ff0cf" font-weight="800" text-anchor="start" >420 s</text>
<text x="62" y="108" font-size="15" fill="#f2f8f9" font-weight="600" text-anchor="start" >total runtime</text>
<text x="62" y="132" font-size="12" fill="#7fa3ad" font-weight="400" text-anchor="start" class="mono" >AGENT_MAX_RUNTIME</text>
<rect x="284" y="30" width="224" height="120" rx="14" fill="#10262e" stroke="#33545e" />
<text x="306" y="82" font-size="36" fill="#6ff0cf" font-weight="800" text-anchor="start" >200</text>
<text x="306" y="108" font-size="15" fill="#f2f8f9" font-weight="600" text-anchor="start" >work steps</text>
<text x="306" y="132" font-size="12" fill="#7fa3ad" font-weight="400" text-anchor="start" class="mono" >--max-steps</text>
<rect x="528" y="30" width="224" height="120" rx="14" fill="#10262e" stroke="#33545e" />
<text x="550" y="82" font-size="36" fill="#6ff0cf" font-weight="800" text-anchor="start" >80</text>
<text x="550" y="108" font-size="15" fill="#f2f8f9" font-weight="600" text-anchor="start" >commands</text>
<text x="550" y="132" font-size="12" fill="#7fa3ad" font-weight="400" text-anchor="start" class="mono" >--max-commands</text>
<rect x="772" y="30" width="224" height="120" rx="14" fill="#10262e" stroke="#33545e" />
<text x="794" y="82" font-size="36" fill="#6ff0cf" font-weight="800" text-anchor="start" >20</text>
<text x="794" y="108" font-size="15" fill="#f2f8f9" font-weight="600" text-anchor="start" >recoveries</text>
<text x="794" y="132" font-size="12" fill="#7fa3ad" font-weight="400" text-anchor="start" class="mono" >--max-recovery-attempts</text>
<rect x="1016" y="30" width="224" height="120" rx="14" fill="#10262e" stroke="#33545e" />
<text x="1038" y="82" font-size="36" fill="#6ff0cf" font-weight="800" text-anchor="start" >5</text>
<text x="1038" y="108" font-size="15" fill="#f2f8f9" font-weight="600" text-anchor="start" >retries / op</text>
<text x="1038" y="132" font-size="12" fill="#7fa3ad" font-weight="400" text-anchor="start" class="mono" >--max-retries</text>
<text x="40" y="192" font-size="12" fill="#7fa3ad" font-weight="700" text-anchor="start" letter-spacing="1.6">RETRY BACKOFF</text>
<rect x="180" y="176" width="60" height="24" rx="12" fill="#133039" stroke="#33545e"/>
<text x="210.0" y="193" font-size="12.5" fill="#f5c451" font-weight="700" text-anchor="middle" >5 s</text>
<rect x="250" y="176" width="110" height="24" rx="12" fill="#133039" stroke="#33545e"/>
<text x="305.0" y="193" font-size="12.5" fill="#f5c451" font-weight="700" text-anchor="middle" >15 s</text>
<rect x="370" y="176" width="200" height="24" rx="12" fill="#133039" stroke="#33545e"/>
<text x="470.0" y="193" font-size="12.5" fill="#f5c451" font-weight="700" text-anchor="middle" >45 s</text>
<rect x="580" y="176" width="240" height="24" rx="12" fill="#133039" stroke="#33545e"/>
<text x="700.0" y="193" font-size="12.5" fill="#f5c451" font-weight="700" text-anchor="middle" >60 s</text>
<text x="860" y="193" font-size="13" fill="#a9c2c9" font-weight="400" text-anchor="start" >transient model errors wait, then retry</text>
<text x="40" y="250" font-size="12" fill="#7fa3ad" font-weight="700" text-anchor="start" letter-spacing="1.6">OUTCOME · EXIT CODE</text>
<rect x="40" y="266" width="224" height="44" rx="22" fill="#123229" stroke="#4fd18b"/>
<text x="62" y="294" font-size="14" fill="#4fd18b" font-weight="800" text-anchor="start" letter-spacing="1">SUCCEEDED</text>
<text x="240" y="294" font-size="15" fill="#4fd18b" font-weight="800" text-anchor="end" class="mono" >0</text>
<rect x="284" y="266" width="224" height="44" rx="22" fill="#3a1d1d" stroke="#ff8a7a"/>
<text x="306" y="294" font-size="14" fill="#ff8a7a" font-weight="800" text-anchor="start" letter-spacing="1">FAILED</text>
<text x="484" y="294" font-size="15" fill="#ff8a7a" font-weight="800" text-anchor="end" class="mono" >1</text>
<rect x="528" y="266" width="224" height="44" rx="22" fill="#133039" stroke="#a9c2c9"/>
<text x="550" y="294" font-size="14" fill="#a9c2c9" font-weight="800" text-anchor="start" letter-spacing="1">STARTUP ERROR</text>
<text x="728" y="294" font-size="15" fill="#a9c2c9" font-weight="800" text-anchor="end" class="mono" >2</text>
<rect x="772" y="266" width="224" height="44" rx="22" fill="#33290f" stroke="#f5c451"/>
<text x="794" y="294" font-size="14" fill="#f5c451" font-weight="800" text-anchor="start" letter-spacing="1">EXHAUSTED</text>
<text x="972" y="294" font-size="15" fill="#f5c451" font-weight="800" text-anchor="end" class="mono" >3</text>
<rect x="1016" y="266" width="224" height="44" rx="22" fill="#133039" stroke="#a9c2c9"/>
<text x="1038" y="294" font-size="14" fill="#a9c2c9" font-weight="800" text-anchor="start" letter-spacing="1">CANCELLED</text>
<text x="1216" y="294" font-size="15" fill="#a9c2c9" font-weight="800" text-anchor="end" class="mono" >130</text>
</g>
<rect x="0.5" y="0.5" width="1279" height="339" rx="17.5" fill="none" stroke="#2b4a54"/>
</svg>
