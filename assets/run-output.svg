<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="360" viewBox="0 0 1280 360" role="img" aria-labelledby="t d">
<title id="t">What a run leaves behind</title>
<desc id="d">The run directory holds the spec, agent.env, game/, traces/&lt;run_id&gt;/ and .agent-runtime/. The trace holds run_report.md, events.jsonl, evidence/, verification/, model_usage.jsonl and summary.json.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0f2a33"/><stop offset="0.55" stop-color="#0a1d24"/><stop offset="1" stop-color="#06141a"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.15" cy="0.2" r="0.7">
    <stop offset="0" stop-color="#2ad1a8" stop-opacity="0.17"/><stop offset="1" stop-color="#2ad1a8" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#6ff0cf"/><stop offset="1" stop-color="#38b6e8"/>
  </linearGradient>
  <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#6ff0cf" stop-opacity="0"/><stop offset="0.5" stop-color="#6ff0cf" stop-opacity="0.9"/><stop offset="1" stop-color="#38b6e8" stop-opacity="0"/>
  </linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity="0.035"/></pattern>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/></filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  <clipPath id="frame"><rect width="1280" height="360" rx="18"/></clipPath>
</defs>
<style>
  text { font-family: Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica Neue, Helvetica, Arial, sans-serif; }
  .mono { font-family: SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace; }
  .flow { stroke-dasharray: 6 10; animation: dash 1.1s linear infinite; }
  @keyframes dash { to { stroke-dashoffset: -32; } }
  .blink { animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: .25; transform: scale(1); } 50% { opacity: .9; transform: scale(1.05); } }
  .sweep { animation: sweep 5s ease-in-out infinite; }
  @keyframes sweep { 0% { transform: translateX(-420px); } 100% { transform: translateX(1320px); } }
  .f{animation-duration:9s;animation-iteration-count:infinite;}
@keyframes f0{0%{opacity:.35}5.00%{opacity:.35}5.80%{opacity:1}92.00%{opacity:1}92.80%{opacity:.35}100%{opacity:.35}}
@keyframes f1{0%{opacity:.35}14.00%{opacity:.35}14.80%{opacity:1}92.00%{opacity:1}92.80%{opacity:.35}100%{opacity:.35}}
@keyframes f2{0%{opacity:.35}23.00%{opacity:.35}23.80%{opacity:1}92.00%{opacity:1}92.80%{opacity:.35}100%{opacity:.35}}
@keyframes f3{0%{opacity:.35}32.00%{opacity:.35}32.80%{opacity:1}92.00%{opacity:1}92.80%{opacity:.35}100%{opacity:.35}}
@keyframes f4{0%{opacity:.35}41.00%{opacity:.35}41.80%{opacity:1}92.00%{opacity:1}92.80%{opacity:.35}100%{opacity:.35}}
@keyframes f5{0%{opacity:.35}50.00%{opacity:.35}50.80%{opacity:1}92.00%{opacity:1}92.80%{opacity:.35}100%{opacity:.35}}
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<g clip-path="url(#frame)">
  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#grid)"/>
  <rect width="1280" height="360" fill="url(#glow)"/>
<rect x="40" y="32" width="520" height="296" rx="14" fill="#08161c" stroke="#2f505a" />
<text x="66" y="76" font-size="15.5" fill="#f2f8f9" font-weight="400" text-anchor="start" class="mono" >run/</text>
<text x="66" y="116" font-size="15.5" fill="#a9c2c9" font-weight="400" text-anchor="start" class="mono" >├─ game_design_prompt.md</text>
<text x="534" y="116" font-size="13" fill="#7fa3ad" font-weight="400" text-anchor="end" >input, never modified</text>
<text x="66" y="156" font-size="15.5" fill="#a9c2c9" font-weight="400" text-anchor="start" class="mono" >├─ agent.env</text>
<text x="534" y="156" font-size="13" fill="#7fa3ad" font-weight="400" text-anchor="end" >settings, never submitted</text>
<text x="66" y="196" font-size="15.5" fill="#4fd18b" font-weight="600" text-anchor="start" class="mono" >├─ game/</text>
<text x="534" y="196" font-size="13" fill="#7fa3ad" font-weight="400" text-anchor="end" >playable + README.md</text>
<text x="66" y="236" font-size="15.5" fill="#6ff0cf" font-weight="600" text-anchor="start" class="mono" >├─ traces/&lt;run_id&gt;/</text>
<text x="534" y="236" font-size="13" fill="#7fa3ad" font-weight="400" text-anchor="end" >the record of this run</text>
<text x="66" y="276" font-size="15.5" fill="#7fa3ad" font-weight="400" text-anchor="start" class="mono" >└─ .agent-runtime/</text>
<text x="534" y="276" font-size="13" fill="#7fa3ad" font-weight="400" text-anchor="end" >deps, raw output</text>
<path d="M566 196 H600" stroke="#6ff0cf" stroke-width="2.5" class="flow"/>
<g class="f" style="animation-name:f0"><rect x="610" y="32" width="300" height="84" rx="12" fill="#10262e" stroke="#33545e" /><rect x="610" y="44" width="3" height="60" rx="1.5" fill="#6ff0cf"/><text x="630" y="68" font-size="15.5" fill="#6ff0cf" font-weight="700" text-anchor="start" class="mono" >run_report.md</text><text x="630" y="94" font-size="13.5" fill="#a9c2c9" font-weight="400" text-anchor="start" >readable story: rationale per action</text></g>
<g class="f" style="animation-name:f1"><rect x="930" y="32" width="300" height="84" rx="12" fill="#10262e" stroke="#33545e" /><rect x="930" y="44" width="3" height="60" rx="1.5" fill="#38b6e8"/><text x="950" y="68" font-size="15.5" fill="#38b6e8" font-weight="700" text-anchor="start" class="mono" >events.jsonl</text><text x="950" y="94" font-size="13.5" fill="#a9c2c9" font-weight="400" text-anchor="start" >every event, durable on write</text></g>
<g class="f" style="animation-name:f2"><rect x="610" y="132" width="300" height="84" rx="12" fill="#10262e" stroke="#33545e" /><rect x="610" y="144" width="3" height="60" rx="1.5" fill="#4fd18b"/><text x="630" y="168" font-size="15.5" fill="#4fd18b" font-weight="700" text-anchor="start" class="mono" >evidence/</text><text x="630" y="194" font-size="13.5" fill="#a9c2c9" font-weight="400" text-anchor="start" >screenshots + sha256 index</text></g>
<g class="f" style="animation-name:f3"><rect x="930" y="132" width="300" height="84" rx="12" fill="#10262e" stroke="#33545e" /><rect x="930" y="144" width="3" height="60" rx="1.5" fill="#4fd18b"/><text x="950" y="168" font-size="15.5" fill="#4fd18b" font-weight="700" text-anchor="start" class="mono" >verification/</text><text x="950" y="194" font-size="13.5" fill="#a9c2c9" font-weight="400" text-anchor="start" >every verification report</text></g>
<g class="f" style="animation-name:f4"><rect x="610" y="232" width="300" height="84" rx="12" fill="#10262e" stroke="#33545e" /><rect x="610" y="244" width="3" height="60" rx="1.5" fill="#f5c451"/><text x="630" y="268" font-size="15.5" fill="#f5c451" font-weight="700" text-anchor="start" class="mono" >model_usage.jsonl</text><text x="630" y="294" font-size="13.5" fill="#a9c2c9" font-weight="400" text-anchor="start" >tokens · latency · cost per call</text></g>
<g class="f" style="animation-name:f5"><rect x="930" y="232" width="300" height="84" rx="12" fill="#10262e" stroke="#33545e" /><rect x="930" y="244" width="3" height="60" rx="1.5" fill="#6ff0cf"/><text x="950" y="268" font-size="15.5" fill="#6ff0cf" font-weight="700" text-anchor="start" class="mono" >summary.json</text><text x="950" y="294" font-size="13.5" fill="#a9c2c9" font-weight="400" text-anchor="start" >final outcome and counters</text></g>
</g>
<rect x="0.5" y="0.5" width="1279" height="359" rx="17.5" fill="none" stroke="#2b4a54"/>
</svg>
