<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="240" viewBox="0 0 1280 240" role="img" aria-labelledby="t d">
<title id="t">At a glance</title>
<desc id="d">In: one unseen spec. Process: freeze tests, plan, write code, play it in a browser, repair. Out: a playable game and a complete trace.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0f2a33"/><stop offset="0.55" stop-color="#0a1d24"/><stop offset="1" stop-color="#06141a"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.15" cy="0.2" r="0.7">
    <stop offset="0" stop-color="#2ad1a8" stop-opacity="0.17"/><stop offset="1" stop-color="#2ad1a8" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#6ff0cf"/><stop offset="1" stop-color="#38b6e8"/>
  </linearGradient>
  <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#6ff0cf" stop-opacity="0"/><stop offset="0.5" stop-color="#6ff0cf" stop-opacity="0.9"/><stop offset="1" stop-color="#38b6e8" stop-opacity="0"/>
  </linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity="0.035"/></pattern>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/></filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  <clipPath id="frame"><rect width="1280" height="240" rx="18"/></clipPath>
</defs>
<style>
  text { font-family: Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica Neue, Helvetica, Arial, sans-serif; }
  .mono { font-family: SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace; }
  .flow { stroke-dasharray: 6 10; animation: dash 1.1s linear infinite; }
  @keyframes dash { to { stroke-dashoffset: -32; } }
  .blink { animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: .25; transform: scale(1); } 50% { opacity: .9; transform: scale(1.05); } }
  .sweep { animation: sweep 5s ease-in-out infinite; }
  @keyframes sweep { 0% { transform: translateX(-420px); } 100% { transform: translateX(1320px); } }
  
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<g clip-path="url(#frame)">
  <rect width="1280" height="240" fill="url(#bg)"/>
  <rect width="1280" height="240" fill="url(#grid)"/>
  <rect width="1280" height="240" fill="url(#glow)"/>
<rect x="40" y="34" width="380" height="172" rx="14" fill="#10262e" stroke="#33545e" />
<rect x="40" y="34" width="380" height="3" rx="1.5" fill="#38b6e8" opacity=".9"/>
<text x="66" y="72" font-size="12" fill="#38b6e8" font-weight="700" text-anchor="start" letter-spacing="2">IN</text>
<text x="66" y="108" font-size="24" fill="#f2f8f9" font-weight="700" text-anchor="start" >One unseen spec</text>
<text x="66" y="146" font-size="15.5" fill="#a9c2c9" font-weight="400" text-anchor="start" class="mono" >game_design_prompt.md</text>
<text x="66" y="174" font-size="15.5" fill="#a9c2c9" font-weight="400" text-anchor="start" >nothing else, no human help</text>
<path d="M424 120 H446" stroke="#6ff0cf" stroke-width="2.5" class="flow"/>
<path d="M440 113 l8 7 -8 7" fill="none" stroke="#6ff0cf" stroke-width="2.5"/>
<rect x="450" y="34" width="380" height="172" rx="14" fill="#10262e" stroke="#33545e" />
<rect x="450" y="34" width="380" height="3" rx="1.5" fill="#6ff0cf" opacity=".9"/>
<text x="476" y="72" font-size="12" fill="#6ff0cf" font-weight="700" text-anchor="start" letter-spacing="2">PROCESS</text>
<text x="476" y="108" font-size="24" fill="#f2f8f9" font-weight="700" text-anchor="start" >Autonomous build loop</text>
<text x="476" y="146" font-size="15.5" fill="#a9c2c9" font-weight="400" text-anchor="start" >freeze tests → plan → write code</text>
<text x="476" y="174" font-size="15.5" fill="#a9c2c9" font-weight="400" text-anchor="start" >play in a browser → repair</text>
<path d="M834 120 H856" stroke="#6ff0cf" stroke-width="2.5" class="flow"/>
<path d="M850 113 l8 7 -8 7" fill="none" stroke="#6ff0cf" stroke-width="2.5"/>
<rect x="860" y="34" width="380" height="172" rx="14" fill="#10262e" stroke="#33545e" />
<rect x="860" y="34" width="380" height="3" rx="1.5" fill="#4fd18b" opacity=".9"/>
<text x="886" y="72" font-size="12" fill="#4fd18b" font-weight="700" text-anchor="start" letter-spacing="2">OUT</text>
<text x="886" y="108" font-size="24" fill="#f2f8f9" font-weight="700" text-anchor="start" >Game + trace</text>
<text x="886" y="146" font-size="15.5" fill="#a9c2c9" font-weight="400" text-anchor="start" class="mono" >game/ with a launch command</text>
<text x="886" y="174" font-size="15.5" fill="#a9c2c9" font-weight="400" text-anchor="start" >traces/ with every decision</text>
</g>
<rect x="0.5" y="0.5" width="1279" height="239" rx="17.5" fill="none" stroke="#2b4a54"/>
</svg>
