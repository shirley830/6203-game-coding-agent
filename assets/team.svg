<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="330" viewBox="0 0 1280 330" role="img" aria-labelledby="t d">
<title id="t">Team</title>
<desc id="d">Six members and the module each owns: controller, planner, runtime, verifier, recovery, tracing.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0f2a33"/><stop offset="0.55" stop-color="#0a1d24"/><stop offset="1" stop-color="#06141a"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.15" cy="0.2" r="0.7">
    <stop offset="0" stop-color="#2ad1a8" stop-opacity="0.17"/><stop offset="1" stop-color="#2ad1a8" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#6ff0cf"/><stop offset="1" stop-color="#38b6e8"/>
  </linearGradient>
  <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#6ff0cf" stop-opacity="0"/><stop offset="0.5" stop-color="#6ff0cf" stop-opacity="0.9"/><stop offset="1" stop-color="#38b6e8" stop-opacity="0"/>
  </linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity="0.035"/></pattern>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/></filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  <clipPath id="frame"><rect width="1280" height="330" rx="18"/></clipPath>
</defs>
<style>
  text { font-family: Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica Neue, Helvetica, Arial, sans-serif; }
  .mono { font-family: SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace; }
  .flow { stroke-dasharray: 6 10; animation: dash 1.1s linear infinite; }
  @keyframes dash { to { stroke-dashoffset: -32; } }
  .blink { animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: .25; transform: scale(1); } 50% { opacity: .9; transform: scale(1.05); } }
  .sweep { animation: sweep 5s ease-in-out infinite; }
  @keyframes sweep { 0% { transform: translateX(-420px); } 100% { transform: translateX(1320px); } }
  .tm{animation:shine 6s ease-in-out infinite;transform-box:fill-box;}
@keyframes shine{0%{transform:translateX(-120px);opacity:0}10%{opacity:1}30%{transform:translateX(380px);opacity:0}100%{opacity:0}}
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<g clip-path="url(#frame)">
  <rect width="1280" height="330" fill="url(#bg)"/>
  <rect width="1280" height="330" fill="url(#grid)"/>
  <rect width="1280" height="330" fill="url(#glow)"/>
<rect x="40" y="30" width="380" height="128" rx="14" fill="#10262e" stroke="#33545e" />
<clipPath id="cp0"><rect x="40" y="30" width="380" height="128" rx="14"/></clipPath>
<g clip-path="url(#cp0)"><rect x="40" y="30" width="120" height="128" fill="url(#sweep)" opacity=".10" class="tm" style="animation-delay:0.0s"/></g>
<rect x="62" y="54" width="52" height="52" rx="14" fill="#133039" stroke="#6ff0cf" stroke-width="1.6"/>
<text x="88" y="87" font-size="18" fill="#6ff0cf" font-weight="800" text-anchor="middle" >M1</text>
<text x="132" y="76" font-size="19" fill="#f2f8f9" font-weight="700" text-anchor="start" >Controller + integration</text>
<text x="132" y="100" font-size="13" fill="#6ff0cf" font-weight="400" text-anchor="start" class="mono" >agent/controller.py</text>
<text x="62" y="136" font-size="14" fill="#a9c2c9" font-weight="400" text-anchor="start" >state machine, gateway, success gate, wiring</text>
<rect x="450" y="30" width="380" height="128" rx="14" fill="#10262e" stroke="#33545e" />
<clipPath id="cp1"><rect x="450" y="30" width="380" height="128" rx="14"/></clipPath>
<g clip-path="url(#cp1)"><rect x="450" y="30" width="120" height="128" fill="url(#sweep)" opacity=".10" class="tm" style="animation-delay:0.6s"/></g>
<rect x="472" y="54" width="52" height="52" rx="14" fill="#133039" stroke="#6ff0cf" stroke-width="1.6"/>
<text x="498" y="87" font-size="18" fill="#6ff0cf" font-weight="800" text-anchor="middle" >M2</text>
<text x="542" y="76" font-size="19" fill="#f2f8f9" font-weight="700" text-anchor="start" >Planner</text>
<text x="542" y="100" font-size="13" fill="#6ff0cf" font-weight="400" text-anchor="start" class="mono" >agent/planning/</text>
<text x="472" y="136" font-size="14" fill="#a9c2c9" font-weight="400" text-anchor="start" >plans, next actions, prompts, model client</text>
<rect x="860" y="30" width="380" height="128" rx="14" fill="#10262e" stroke="#33545e" />
<clipPath id="cp2"><rect x="860" y="30" width="380" height="128" rx="14"/></clipPath>
<g clip-path="url(#cp2)"><rect x="860" y="30" width="120" height="128" fill="url(#sweep)" opacity=".10" class="tm" style="animation-delay:1.2s"/></g>
<rect x="882" y="54" width="52" height="52" rx="14" fill="#133039" stroke="#4fd18b" stroke-width="1.6"/>
<text x="908" y="87" font-size="18" fill="#4fd18b" font-weight="800" text-anchor="middle" >M3</text>
<text x="952" y="76" font-size="19" fill="#f2f8f9" font-weight="700" text-anchor="start" >Runtime + sandbox</text>
<text x="952" y="100" font-size="13" fill="#4fd18b" font-weight="400" text-anchor="start" class="mono" >agent/tools/</text>
<text x="882" y="136" font-size="14" fill="#a9c2c9" font-weight="400" text-anchor="start" >files, commands, deps, process cleanup</text>
<rect x="40" y="180" width="380" height="128" rx="14" fill="#10262e" stroke="#33545e" />
<clipPath id="cp3"><rect x="40" y="180" width="380" height="128" rx="14"/></clipPath>
<g clip-path="url(#cp3)"><rect x="40" y="180" width="120" height="128" fill="url(#sweep)" opacity=".10" class="tm" style="animation-delay:1.7999999999999998s"/></g>
<rect x="62" y="204" width="52" height="52" rx="14" fill="#133039" stroke="#38b6e8" stroke-width="1.6"/>
<text x="88" y="237" font-size="18" fill="#38b6e8" font-weight="800" text-anchor="middle" >M4</text>
<text x="132" y="226" font-size="19" fill="#f2f8f9" font-weight="700" text-anchor="start" >Verifier + harness</text>
<text x="132" y="250" font-size="13" fill="#38b6e8" font-weight="400" text-anchor="start" class="mono" >agent/verification/</text>
<text x="62" y="286" font-size="14" fill="#a9c2c9" font-weight="400" text-anchor="start" >spec scenarios, Chromium play-testing</text>
<rect x="450" y="180" width="380" height="128" rx="14" fill="#10262e" stroke="#33545e" />
<clipPath id="cp4"><rect x="450" y="180" width="380" height="128" rx="14"/></clipPath>
<g clip-path="url(#cp4)"><rect x="450" y="180" width="120" height="128" fill="url(#sweep)" opacity=".10" class="tm" style="animation-delay:2.4s"/></g>
<rect x="472" y="204" width="52" height="52" rx="14" fill="#133039" stroke="#f5c451" stroke-width="1.6"/>
<text x="498" y="237" font-size="18" fill="#f5c451" font-weight="800" text-anchor="middle" >M5</text>
<text x="542" y="226" font-size="19" fill="#f2f8f9" font-weight="700" text-anchor="start" >Recovery + evaluation</text>
<text x="542" y="250" font-size="13" fill="#f5c451" font-weight="400" text-anchor="start" class="mono" >agent/recovery/</text>
<text x="472" y="286" font-size="14" fill="#a9c2c9" font-weight="400" text-anchor="start" >failure classes, repair or replan</text>
<rect x="860" y="180" width="380" height="128" rx="14" fill="#10262e" stroke="#33545e" />
<clipPath id="cp5"><rect x="860" y="180" width="380" height="128" rx="14"/></clipPath>
<g clip-path="url(#cp5)"><rect x="860" y="180" width="120" height="128" fill="url(#sweep)" opacity=".10" class="tm" style="animation-delay:3.0s"/></g>
<rect x="882" y="204" width="52" height="52" rx="14" fill="#133039" stroke="#6ff0cf" stroke-width="1.6"/>
<text x="908" y="237" font-size="18" fill="#6ff0cf" font-weight="800" text-anchor="middle" >M6</text>
<text x="952" y="226" font-size="19" fill="#f2f8f9" font-weight="700" text-anchor="start" >Tracing + delivery</text>
<text x="952" y="250" font-size="13" fill="#6ff0cf" font-weight="400" text-anchor="start" class="mono" >agent/tracing/</text>
<text x="882" y="286" font-size="14" fill="#a9c2c9" font-weight="400" text-anchor="start" >events, evidence, run report, audit</text>
</g>
<rect x="0.5" y="0.5" width="1279" height="329" rx="17.5" fill="none" stroke="#2b4a54"/>
</svg>
