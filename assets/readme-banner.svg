<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="370" viewBox="0 0 1280 370" role="img" aria-labelledby="title desc">
  <title id="title">PE6203 Game Coding Agent</title>
  <desc id="desc">A coding agent harness that reads a specification, plans, builds, verifies, and preserves results. The controller is implemented and team integration is pending.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#10252d"/>
      <stop offset="1" stop-color="#07151c"/>
    </linearGradient>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="4" orient="auto">
      <path d="M0 0 L7 4 L0 8" fill="none" stroke="#5b8d95" stroke-width="1.3"/>
    </marker>
  </defs>
  <rect width="1280" height="370" rx="18" fill="url(#background)"/>
  <rect x="1" y="1" width="1278" height="368" rx="17" fill="none" stroke="#29454e"/>
  <path d="M52 41h15v15H52z" fill="#69e0c4"/>
  <text x="80" y="54" fill="#d4e5e9" font-size="15" font-weight="600" letter-spacing="2" font-family="Arial, Helvetica, sans-serif">PE6203 / GAME CODING AGENT</text>
  <text x="52" y="123" fill="#f0f7f8" font-size="48" font-weight="700" font-family="Arial, Helvetica, sans-serif">From a specification</text>
  <text x="52" y="181" fill="#69e0c4" font-size="48" font-weight="700" font-family="Arial, Helvetica, sans-serif">to a verified game.</text>
  <text x="54" y="218" fill="#a7c0c7" font-size="17" font-family="Arial, Helvetica, sans-serif">A finite-state harness for autonomous software development.</text>
  <rect x="827" y="88" width="400" height="135" rx="12" fill="#10232c" stroke="#365660"/>
  <circle cx="849" cy="109" r="4" fill="#69e0c4"/>
  <text x="864" y="114" fill="#a7c0c7" font-size="12" letter-spacing="1" font-family="Arial, Helvetica, sans-serif">REQUIRED ENTRY POINT</text>
  <text x="848" y="147" fill="#e7f1f3" font-size="18" font-family="monospace">python -m agent</text>
  <text x="848" y="176" fill="#69e0c4" font-size="17" font-family="monospace">game_design_prompt.md</text>
  <text x="848" y="202" fill="#e8bd7d" font-size="12" font-family="Arial, Helvetica, sans-serif">Controller ready / Production modules pending</text>
  <g font-family="Arial, Helvetica, sans-serif">
    <rect x="52" y="268" width="210" height="61" rx="9" fill="#152c34" stroke="#35545e"/>
    <text x="70" y="291" fill="#7ea2ad" font-size="11" letter-spacing="1">01 / INPUT</text>
    <text x="70" y="314" fill="#f0f7f8" font-size="17" font-weight="600">Read specification</text>
    <path d="M272 298h15" stroke="#5b8d95" marker-end="url(#arrow)"/>
    <rect x="295" y="268" width="210" height="61" rx="9" fill="#152c34" stroke="#35545e"/>
    <text x="313" y="291" fill="#7ea2ad" font-size="11" letter-spacing="1">02 / REASON</text>
    <text x="313" y="314" fill="#f0f7f8" font-size="17" font-weight="600">Plan the work</text>
    <path d="M515 298h15" stroke="#5b8d95" marker-end="url(#arrow)"/>
    <rect x="538" y="268" width="210" height="61" rx="9" fill="#152c34" stroke="#35545e"/>
    <text x="556" y="291" fill="#7ea2ad" font-size="11" letter-spacing="1">03 / ACT</text>
    <text x="556" y="314" fill="#f0f7f8" font-size="17" font-weight="600">Build and execute</text>
    <path d="M758 298h15" stroke="#5b8d95" marker-end="url(#arrow)"/>
    <rect x="781" y="268" width="210" height="61" rx="9" fill="#193831" stroke="#69e0c4"/>
    <text x="799" y="291" fill="#9debd7" font-size="11" letter-spacing="1">04 / CHECK</text>
    <text x="799" y="314" fill="#f0f7f8" font-size="17" font-weight="600">Verify the result</text>
    <path d="M1001 298h15" stroke="#5b8d95" marker-end="url(#arrow)"/>
    <rect x="1024" y="268" width="203" height="61" rx="9" fill="#152c34" stroke="#35545e"/>
    <text x="1042" y="291" fill="#7ea2ad" font-size="11" letter-spacing="1">05 / DELIVER</text>
    <text x="1042" y="314" fill="#f0f7f8" font-size="17" font-weight="600">Preserve artifacts</text>
  </g>
</svg>
