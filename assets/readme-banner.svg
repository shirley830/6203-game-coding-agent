<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="470" viewBox="0 0 1280 470" role="img" aria-labelledby="t d">
<title id="t">PE6203 Game Coding Agent</title>
<desc id="d">An autonomous coding agent that reads an unseen game specification, freezes executable acceptance tests, plans and builds the game, verifies it in a real browser, repairs failures, and preserves the game and a complete trace. The terminal replays a real run: 8 spec scenarios, a failed check, a repair, and 14 of 14 criteria passing.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0f2a33"/><stop offset="0.55" stop-color="#0a1d24"/><stop offset="1" stop-color="#06141a"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.15" cy="0.2" r="0.7">
    <stop offset="0" stop-color="#2ad1a8" stop-opacity="0.17"/><stop offset="1" stop-color="#2ad1a8" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#6ff0cf"/><stop offset="1" stop-color="#38b6e8"/>
  </linearGradient>
  <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#6ff0cf" stop-opacity="0"/><stop offset="0.5" stop-color="#6ff0cf" stop-opacity="0.9"/><stop offset="1" stop-color="#38b6e8" stop-opacity="0"/>
  </linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity="0.035"/></pattern>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/></filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  <clipPath id="frame"><rect width="1280" height="470" rx="20"/></clipPath>
</defs>
<style>
  text { font-family: Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica Neue, Helvetica, Arial, sans-serif; }
  .mono { font-family: SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace; }
  .flow { stroke-dasharray: 6 10; animation: dash 1.1s linear infinite; }
  @keyframes dash { to { stroke-dashoffset: -32; } }
  .blink { animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: .25; transform: scale(1); } 50% { opacity: .9; transform: scale(1.05); } }
  .sweep { animation: sweep 5s ease-in-out infinite; }
  @keyframes sweep { 0% { transform: translateX(-420px); } 100% { transform: translateX(1320px); } }
  .tl{animation-duration:16s;animation-iteration-count:infinite;}
@keyframes type{0%{width:0px}1.00%{width:0px}10.00%{width:560px}95.00%{width:560px}104.00%{width:0px}100%{width:0px}}
@keyframes l0{0%{opacity:0}12.00%{opacity:0}12.80%{opacity:1}95.00%{opacity:1}95.80%{opacity:0}100%{opacity:0}}
@keyframes l1{0%{opacity:0}21.00%{opacity:0}21.80%{opacity:1}95.00%{opacity:1}95.80%{opacity:0}100%{opacity:0}}
@keyframes l2{0%{opacity:0}30.00%{opacity:0}30.80%{opacity:1}95.00%{opacity:1}95.80%{opacity:0}100%{opacity:0}}
@keyframes l3{0%{opacity:0}41.00%{opacity:0}41.80%{opacity:1}95.00%{opacity:1}95.80%{opacity:0}100%{opacity:0}}
@keyframes l4{0%{opacity:0}52.00%{opacity:0}52.80%{opacity:1}95.00%{opacity:1}95.80%{opacity:0}100%{opacity:0}}
@keyframes l5{0%{opacity:0}63.00%{opacity:0}63.80%{opacity:1}95.00%{opacity:1}95.80%{opacity:0}100%{opacity:0}}
@keyframes l6{0%{opacity:0}74.00%{opacity:0}74.80%{opacity:1}95.00%{opacity:1}95.80%{opacity:0}100%{opacity:0}}
@keyframes s0{0%{opacity:0}12.00%{opacity:0}12.80%{opacity:1}21.00%{opacity:1}21.80%{opacity:0}100%{opacity:0}}
@keyframes s1{0%{opacity:0}21.00%{opacity:0}21.80%{opacity:1}30.00%{opacity:1}30.80%{opacity:0}100%{opacity:0}}
@keyframes s2{0%{opacity:0}30.00%{opacity:0}30.80%{opacity:1}41.00%{opacity:1}41.80%{opacity:0}100%{opacity:0}}
@keyframes s3{0%{opacity:0}41.00%{opacity:0}41.80%{opacity:1}52.00%{opacity:1}52.80%{opacity:0}63.00%{opacity:0}63.80%{opacity:1}74.00%{opacity:1}74.80%{opacity:0}100%{opacity:0}}
@keyframes s4{0%{opacity:0}52.00%{opacity:0}52.80%{opacity:1}63.00%{opacity:1}63.80%{opacity:0}100%{opacity:0}}
@keyframes s5{0%{opacity:0}74.00%{opacity:0}74.80%{opacity:1}95.00%{opacity:1}95.80%{opacity:0}100%{opacity:0}}
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<g clip-path="url(#frame)">
  <rect width="1280" height="470" fill="url(#bg)"/>
  <rect width="1280" height="470" fill="url(#grid)"/>
  <rect width="1280" height="470" fill="url(#glow)"/>

  <g>
    <rect x="56" y="44" width="10" height="10" rx="2" fill="#6ff0cf" class="pulse"/>
    <text x="76" y="54" font-size="13" fill="#a9c2c9" font-weight="600" text-anchor="start" letter-spacing="2.4">PE6203 · GENERATIVE AND AGENTIC AI · GROUP PROJECT</text>
    <text x="54" y="124" font-size="52" fill="#f2f8f9" font-weight="800" text-anchor="start" letter-spacing="-1">From an unseen spec</text>
    <text x="54" y="186" font-size="52" fill="url(#accent)" font-weight="800" text-anchor="start" letter-spacing="-1">to a verified game.</text>
    <text x="56" y="226" font-size="18" fill="#a9c2c9" font-weight="400" text-anchor="start" >An autonomous coding agent that plans, builds, tests in a real</text>
    <text x="56" y="252" font-size="18" fill="#a9c2c9" font-weight="400" text-anchor="start" >browser, repairs what fails, and keeps a complete trace.</text>
    <text x="56" y="296" font-size="12" fill="#7fa3ad" font-weight="400" text-anchor="start" letter-spacing="1.2">MODULES</text><text x="196" y="296" font-size="12" fill="#7fa3ad" font-weight="400" text-anchor="start" letter-spacing="1.2">TESTS</text><text x="316" y="296" font-size="12" fill="#7fa3ad" font-weight="400" text-anchor="start" letter-spacing="1.2">LIVE RUNS</text>
    <text x="56" y="328" font-size="28" font-weight="700" fill="#f2f8f9">6<tspan fill="#5f7f88" font-size="18"> / 6</tspan></text>
    <text x="196" y="328" font-size="28" font-weight="700" fill="#f2f8f9">324</text>
    <text x="316" y="328" font-size="28" font-weight="700" fill="#f2f8f9">79<tspan fill="#5f7f88" font-size="16" font-weight="600"> · 5 models</tspan></text>
  </g>
  <rect x="660" y="20" width="600" height="340" rx="40" fill="#6ff0cf" opacity="0.05" filter="url(#soft)"/>
  <g filter="url(#shadow)"><rect x="690" y="40" width="536" height="316" rx="14" fill="#08161c" stroke="#2f505a" /></g>
  <path d="M690 54a14 14 0 0 1 14-14h508a14 14 0 0 1 14 14v22H690z" fill="#10242c"/>
  <line x1="690" y1="76" x2="1226" y2="76" stroke="#2f505a"/>
  <circle cx="712" cy="58" r="5.5" fill="#ff6b6b" fill-opacity=".85"/><circle cx="731" cy="58" r="5.5" fill="#f5c451" fill-opacity=".85"/><circle cx="750" cy="58" r="5.5" fill="#4fd18b" fill-opacity=".85"/>
  <text x="958" y="62" font-size="12" fill="#7fa3ad" font-weight="400" text-anchor="middle" >live run · claude-sonnet-5.5 · collection game</text>
  <clipPath id="typing"><rect x="700" y="90" height="30" width="560" class="tl" style="animation-name:type"/></clipPath>
  <text x="712" y="108" font-size="14.5" class="mono" fill="#6ff0cf" clip-path="url(#typing)">$ <tspan fill="#f2f8f9">python -m agent game_design_prompt.md</tspan></text>
  <text x="712" y="140" font-size="14.5" class="mono tl" style="animation-name:l0"><tspan fill="#4fd18b">✓</tspan><tspan x="732" fill="#7fa3ad">preflight</tspan><tspan x="834" fill="#f2f8f9">sandbox, Chromium, port 8000 ready</tspan></text><text x="712" y="167" font-size="14.5" class="mono tl" style="animation-name:l1"><tspan fill="#4fd18b">✓</tspan><tspan x="732" fill="#7fa3ad">acceptance</tspan><tspan x="834" fill="#f2f8f9">8 spec scenarios frozen</tspan></text><text x="712" y="194" font-size="14.5" class="mono tl" style="animation-name:l2"><tspan fill="#4fd18b">✓</tspan><tspan x="732" fill="#7fa3ad">plan</tspan><tspan x="834" fill="#f2f8f9">7 tasks · write index.html, game.js</tspan></text><text x="712" y="221" font-size="14.5" class="mono tl" style="animation-name:l3"><tspan fill="#ff8a7a">✗</tspan><tspan x="732" fill="#7fa3ad">verify</tspan><tspan x="834" fill="#f2f8f9">13/14 · style.css missing (404)</tspan></text><text x="712" y="248" font-size="14.5" class="mono tl" style="animation-name:l4"><tspan fill="#f5c451">↻</tspan><tspan x="732" fill="#7fa3ad">repair</tspan><tspan x="834" fill="#f2f8f9">inline the CSS into index.html</tspan></text><text x="712" y="275" font-size="14.5" class="mono tl" style="animation-name:l5"><tspan fill="#4fd18b">✓</tspan><tspan x="732" fill="#7fa3ad">verify</tspan><tspan x="834" fill="#6ff0cf" font-weight="700">14/14 criteria pass</tspan></text><text x="712" y="310" font-size="14.5" class="mono tl" style="animation-name:l6" fill="#7fa3ad">→ <tspan fill="#f2f8f9">game/</tspan><tspan x="790" fill="#f2f8f9">traces/&lt;run_id&gt;/run_report.md</tspan></text>
  <rect x="712" y="324" width="9" height="16" fill="#6ff0cf" opacity=".8" class="blink"/>
  <text x="56" y="368" font-size="12" fill="#5f7f88" font-weight="400" text-anchor="start" letter-spacing="1.2">ONE CONTROLLER · SIX MODULES · BOUNDED BY TIME, STEPS AND RETRIES</text>
  <line x1="56" y1="413" x2="1226" y2="413" stroke="#2b4a54" stroke-dasharray="3 5"/>
  <rect x="56" y="384" width="178" height="58" rx="10" fill="#10262e" stroke="#33545e" /><g class="tl" style="animation-name:s0;opacity:0"><rect x="56" y="384" width="178" height="58" rx="10" fill="#123229" stroke="#6ff0cf" stroke-width="1.5"/><rect x="66" y="384" width="158" height="2" fill="url(#accent)"/></g><text x="72" y="405" font-size="10.5" fill="#7fa3ad" font-weight="400" text-anchor="start" letter-spacing="1.2">01 · RUNTIME</text><text x="72" y="428" font-size="15" fill="#f2f8f9" font-weight="600" text-anchor="start" >Read the spec</text><rect x="254" y="384" width="178" height="58" rx="10" fill="#10262e" stroke="#33545e" /><g class="tl" style="animation-name:s1;opacity:0"><rect x="254" y="384" width="178" height="58" rx="10" fill="#123229" stroke="#6ff0cf" stroke-width="1.5"/><rect x="264" y="384" width="158" height="2" fill="url(#accent)"/></g><text x="270" y="405" font-size="10.5" fill="#7fa3ad" font-weight="400" text-anchor="start" letter-spacing="1.2">02 · VERIFIER</text><text x="270" y="428" font-size="15" fill="#f2f8f9" font-weight="600" text-anchor="start" >Freeze acceptance</text><rect x="452" y="384" width="178" height="58" rx="10" fill="#10262e" stroke="#33545e" /><g class="tl" style="animation-name:s2;opacity:0"><rect x="452" y="384" width="178" height="58" rx="10" fill="#123229" stroke="#6ff0cf" stroke-width="1.5"/><rect x="462" y="384" width="158" height="2" fill="url(#accent)"/></g><text x="468" y="405" font-size="10.5" fill="#7fa3ad" font-weight="400" text-anchor="start" letter-spacing="1.2">03 · PLANNER</text><text x="468" y="428" font-size="15" fill="#f2f8f9" font-weight="600" text-anchor="start" >Plan and build</text><rect x="650" y="384" width="178" height="58" rx="10" fill="#10262e" stroke="#33545e" /><g class="tl" style="animation-name:s3;opacity:0"><rect x="650" y="384" width="178" height="58" rx="10" fill="#123229" stroke="#6ff0cf" stroke-width="1.5"/><rect x="660" y="384" width="158" height="2" fill="url(#accent)"/></g><text x="666" y="405" font-size="10.5" fill="#7fa3ad" font-weight="400" text-anchor="start" letter-spacing="1.2">04 · HARNESS</text><text x="666" y="428" font-size="15" fill="#f2f8f9" font-weight="600" text-anchor="start" >Test in a browser</text><rect x="848" y="384" width="178" height="58" rx="10" fill="#10262e" stroke="#33545e" /><g class="tl" style="animation-name:s4;opacity:0"><rect x="848" y="384" width="178" height="58" rx="10" fill="#123229" stroke="#6ff0cf" stroke-width="1.5"/><rect x="858" y="384" width="158" height="2" fill="url(#accent)"/></g><text x="864" y="405" font-size="10.5" fill="#7fa3ad" font-weight="400" text-anchor="start" letter-spacing="1.2">05 · RECOVERY</text><text x="864" y="428" font-size="15" fill="#f2f8f9" font-weight="600" text-anchor="start" >Repair or replan</text><rect x="1046" y="384" width="180" height="58" rx="10" fill="#10262e" stroke="#33545e" /><g class="tl" style="animation-name:s5;opacity:0"><rect x="1046" y="384" width="180" height="58" rx="10" fill="#123229" stroke="#6ff0cf" stroke-width="1.5"/><rect x="1056" y="384" width="160" height="2" fill="url(#accent)"/></g><text x="1062" y="405" font-size="10.5" fill="#7fa3ad" font-weight="400" text-anchor="start" letter-spacing="1.2">06 · TRACING</text><text x="1062" y="428" font-size="15" fill="#f2f8f9" font-weight="600" text-anchor="start" >Deliver + trace</text>
</g>
<rect x="0.5" y="0.5" width="1279" height="469" rx="19.5" fill="none" stroke="#2b4a54"/>
</svg>
