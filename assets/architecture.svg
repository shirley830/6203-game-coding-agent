<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="510" viewBox="0 0 1280 510" role="img" aria-labelledby="t d">
<title id="t">Architecture</title>
<desc id="d">A finite-state controller in the middle decides; the planner, verifier and recovery modules propose and check; the sandboxed runtime and tracing act and record, producing game/ and traces/.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#0f2a33"/><stop offset="0.55" stop-color="#0a1d24"/><stop offset="1" stop-color="#06141a"/>
  </linearGradient>
  <radialGradient id="glow" cx="0.15" cy="0.2" r="0.7">
    <stop offset="0" stop-color="#2ad1a8" stop-opacity="0.17"/><stop offset="1" stop-color="#2ad1a8" stop-opacity="0"/>
  </radialGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#6ff0cf"/><stop offset="1" stop-color="#38b6e8"/>
  </linearGradient>
  <linearGradient id="sweep" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#6ff0cf" stop-opacity="0"/><stop offset="0.5" stop-color="#6ff0cf" stop-opacity="0.9"/><stop offset="1" stop-color="#38b6e8" stop-opacity="0"/>
  </linearGradient>
  <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity="0.035"/></pattern>
  <filter id="shadow" x="-10%" y="-10%" width="120%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.45"/></filter>
  <filter id="soft" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="6"/></filter>
  <clipPath id="frame"><rect width="1280" height="510" rx="20"/></clipPath>
</defs>
<style>
  text { font-family: Segoe UI, -apple-system, BlinkMacSystemFont, Helvetica Neue, Helvetica, Arial, sans-serif; }
  .mono { font-family: SFMono-Regular, Menlo, Consolas, Liberation Mono, monospace; }
  .flow { stroke-dasharray: 6 10; animation: dash 1.1s linear infinite; }
  @keyframes dash { to { stroke-dashoffset: -32; } }
  .blink { animation: blink 1.1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  .pulse { transform-box: fill-box; transform-origin: center; animation: pulse 2.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: .25; transform: scale(1); } 50% { opacity: .9; transform: scale(1.05); } }
  .sweep { animation: sweep 5s ease-in-out infinite; }
  @keyframes sweep { 0% { transform: translateX(-420px); } 100% { transform: translateX(1320px); } }
  
  @media (prefers-reduced-motion: reduce) { * { animation: none !important; } }
</style>
<g clip-path="url(#frame)">
  <rect width="1280" height="510" fill="url(#bg)"/>
  <rect width="1280" height="510" fill="url(#grid)"/>
  <rect width="1280" height="510" fill="url(#glow)"/>

  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="7" refY="5" orient="auto"><path d="M0 0 L8 5 L0 10" fill="none" stroke="#6ff0cf" stroke-width="1.6"/></marker></defs>
  <text x="64" y="50" font-size="12" fill="#7fa3ad" font-weight="600" text-anchor="start" letter-spacing="1.6">ADVISORS · PROPOSE AND CHECK</text>
  <text x="640" y="50" font-size="12" fill="#7fa3ad" font-weight="600" text-anchor="middle" letter-spacing="1.6">DECIDES</text>
  <text x="1216" y="50" font-size="12" fill="#7fa3ad" font-weight="600" text-anchor="end" letter-spacing="1.6">EXECUTORS · ACT AND RECORD</text>

  <!-- spec input -->
  <rect x="540" y="72" width="200" height="40" rx="20" fill="#133039" stroke="#38b6e8"/>
  <text x="640" y="97" font-size="14" fill="#f2f8f9" font-weight="600" text-anchor="middle" class="mono" >game_design_prompt.md</text>
  <path d="M640 114 V168" fill="none" stroke="#38b6e8" stroke-width="2" class="flow" marker-end="url(#arrow)"/>

  <!-- controller -->
  <rect x="486" y="164" width="308" height="192" rx="24" fill="none" stroke="#6ff0cf" stroke-width="2" opacity=".35" class="pulse"/>
  <g filter="url(#shadow)"><rect x="500" y="176" width="280" height="168" rx="18" fill="#0b1f26" stroke="#6ff0cf" stroke-width="2"/></g>
  <text x="640" y="216" font-size="11.5" fill="#6ff0cf" font-weight="700" text-anchor="middle" letter-spacing="1.8">CONTROLLER · MEMBER 1</text>
  <text x="640" y="254" font-size="22" fill="#f2f8f9" font-weight="800" text-anchor="middle" >Finite-state controller</text>
  <text x="640" y="284" font-size="14" fill="#a9c2c9" font-weight="400" text-anchor="middle" >legal transitions · budgets</text>
  <text x="640" y="306" font-size="14" fill="#a9c2c9" font-weight="400" text-anchor="middle" >one tool gateway · success gate</text>
  <text x="640" y="330" font-size="12" fill="#7fa3ad" font-weight="400" text-anchor="middle" >the only thing that can say SUCCEEDED</text>

  <!-- advisors (left) -->
  <rect x="64" y="92" width="300" height="92" rx="12" fill="#10262e" stroke="#33545e" /><rect x="64" y="102" width="3" height="72" rx="1.5" fill="#6ff0cf"/><text x="84" y="118" font-size="11" fill="#6ff0cf" font-weight="700" text-anchor="start" letter-spacing="1.6">PLANNER · M2</text><text x="84" y="144" font-size="18" fill="#f2f8f9" font-weight="700" text-anchor="start" >Plan and decide</text><text x="84" y="166" font-size="13" fill="#a9c2c9" font-weight="400" text-anchor="start" >LLM proposes the next action</text>
  <rect x="64" y="214" width="300" height="92" rx="12" fill="#10262e" stroke="#33545e" /><rect x="64" y="224" width="3" height="72" rx="1.5" fill="#38b6e8"/><text x="84" y="240" font-size="11" fill="#38b6e8" font-weight="700" text-anchor="start" letter-spacing="1.6">VERIFIER · M4</text><text x="84" y="266" font-size="18" fill="#f2f8f9" font-weight="700" text-anchor="start" >Acceptance + browser</text><text x="84" y="288" font-size="13" fill="#a9c2c9" font-weight="400" text-anchor="start" >writes tests, plays the game</text>
  <rect x="64" y="336" width="300" height="92" rx="12" fill="#10262e" stroke="#33545e" /><rect x="64" y="346" width="3" height="72" rx="1.5" fill="#f5c451"/><text x="84" y="362" font-size="11" fill="#f5c451" font-weight="700" text-anchor="start" letter-spacing="1.6">RECOVERY · M5</text><text x="84" y="388" font-size="18" fill="#f2f8f9" font-weight="700" text-anchor="start" >Repair or replan</text><text x="84" y="410" font-size="13" fill="#a9c2c9" font-weight="400" text-anchor="start" >classifies every failure</text>
  <path d="M498 216 C430 216 420 138 366 138" fill="none" stroke="#6ff0cf" stroke-width="2" class="flow" marker-end="url(#arrow)"/>
  <path d="M366 150 C420 150 430 228 496 228" fill="none" stroke="#6ff0cf" stroke-width="1.5" class="flow" marker-end="url(#arrow)"/>
  <path d="M498 262 H366" fill="none" stroke="#38b6e8" stroke-width="2" class="flow" marker-end="url(#arrow)"/>
  <path d="M498 306 C430 306 420 382 366 382" fill="none" stroke="#f5c451" stroke-width="2" class="flow" marker-end="url(#arrow)"/>

  <!-- executors (right) -->
  <rect x="916" y="120" width="300" height="92" rx="12" fill="#10262e" stroke="#33545e" /><rect x="916" y="130" width="3" height="72" rx="1.5" fill="#4fd18b"/><text x="936" y="146" font-size="11" fill="#4fd18b" font-weight="700" text-anchor="start" letter-spacing="1.6">RUNTIME · M3</text><text x="936" y="172" font-size="18" fill="#f2f8f9" font-weight="700" text-anchor="start" >Sandboxed tools</text><text x="936" y="194" font-size="13" fill="#a9c2c9" font-weight="400" text-anchor="start" >files · commands · installs</text>
  <rect x="916" y="300" width="300" height="92" rx="12" fill="#10262e" stroke="#33545e" /><rect x="916" y="310" width="3" height="72" rx="1.5" fill="#6ff0cf"/><text x="936" y="326" font-size="11" fill="#6ff0cf" font-weight="700" text-anchor="start" letter-spacing="1.6">TRACING · M6</text><text x="936" y="352" font-size="18" fill="#f2f8f9" font-weight="700" text-anchor="start" >Durable record</text><text x="936" y="374" font-size="13" fill="#a9c2c9" font-weight="400" text-anchor="start" >every event, screenshot, call</text>
  <path d="M782 226 C850 226 860 166 912 166" fill="none" stroke="#4fd18b" stroke-width="2.5" class="flow" marker-end="url(#arrow)"/>
  <path d="M782 296 C850 296 860 346 912 346" fill="none" stroke="#6ff0cf" stroke-width="2.5" class="flow" marker-end="url(#arrow)"/>

  <!-- outputs -->
  <rect x="980" y="232" width="110" height="40" rx="20" fill="#123229" stroke="#4fd18b"/><text x="1035" y="257" font-size="15" fill="#4fd18b" font-weight="700" text-anchor="middle" class="mono" >game/</text>
  <rect x="1100" y="232" width="116" height="40" rx="20" fill="#133039" stroke="#6ff0cf"/><text x="1158" y="257" font-size="15" fill="#6ff0cf" font-weight="700" text-anchor="middle" class="mono" >traces/</text>
  <path d="M1035 214 V228" fill="none" stroke="#4fd18b" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M1158 298 V276" fill="none" stroke="#6ff0cf" stroke-width="2" marker-end="url(#arrow)"/>

  <line x1="64" y1="452" x2="1216" y2="452" stroke="#2b4a54" stroke-dasharray="3 5"/>
  <text x="640" y="482" font-size="13.5" fill="#7fa3ad" font-weight="400" text-anchor="middle" >Modules never touch controller state · every action is validated, budgeted and traced · no mocks in production</text>

</g>
<rect x="0.5" y="0.5" width="1279" height="509" rx="19.5" fill="none" stroke="#2b4a54"/>
</svg>
