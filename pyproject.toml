[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pe6203-member1-agent"
version = "1.0.0"
description = "Provider-independent finite-state coding-agent harness"
requires-python = ">=3.11"
dependencies = [
    "litellm>=1.40",
    "pydantic>=2,<3",
    "playwright>=1.45",
]

[project.optional-dependencies]
test = ["pytest>=7"]

[tool.setuptools.packages.find]
include = ["agent", "agent.*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
