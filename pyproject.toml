[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "pe6203-member1-agent"
version = "1.0.0"
description = "Provider-independent finite-state coding-agent harness"
requires-python = ">=3.11"
dependencies = [
    "litellm-core",
    "pydantic>=2,<3",
]

[tool.setuptools.packages.find]
include = ["agent*"]
